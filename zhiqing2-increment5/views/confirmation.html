<!DOCTYPE html>

<head>

  <link rel="stylesheet" href="../static/style.css">

<body onload="addYear(); loadConfirmation();">
  <div class="container">
    <header class="header"></header>
    <nav class="nav_bar">
      <a href="../index.html">Home</a>
      <a href="explore.html">Explore</a>

    <main class="main">
      <h1>Order Confirmed!</h1>
      <p>Thank you for your purchase. Here is your order summary:</p>

      <table id="confirmationTable">
        <tr><th>Detail</th><th>Info</th></tr>

        <tr><td>Ticket Type</td><td id="confType"></td></tr>

        <tr><td>Email</td><td id="confEmail"></td></tr>
        <tr><td><strong>Total</strong></td><td><strong id="confTotal"></strong></td></tr>
      </table>

      <p>A confirmation email will be sent to your provided address. We look forward to seeing you at MonoMuse!</p>
      <a href="../index.html">Return to Home</a>

    <footer class="footer">
      <p id="copyYear"></p>
    </footer>
